services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    ports:
      - "80:80"
      - "8002:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3396:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: pumps
    #   MYSQL_USER: root
    #   MYSQL_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: true
    volumes:
      - db_data:/var/lib/mysql
      - ./storage/app/database_dumps:/docker-entrypoint-initdb.d/
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: "" # same as the root password for the MySQL service
      UPLOAD_LIMIT: 3000M

volumes:
  db_data:
